services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travelerguard
      POSTGRES_USER: travelerguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelerguard -d travelerguard"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-local-docker-dev-only-change-me}
      DATABASE_URL: postgresql://travelerguard:${POSTGRES_PASSWORD:-local-dev-only-change-me}@database:5432/travelerguard
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-disabled}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      TWILIO_WEBHOOK_BASE_URL: ${TWILIO_WEBHOOK_BASE_URL:-}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
